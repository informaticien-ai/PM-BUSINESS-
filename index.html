<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM BUSINESS - Fournisseurs & Supabase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="header-container"></div>

    <!-- PAGE FOURNISSEURS (Liste dynamique) -->
    <div id="page-fournisseurs" class="page active">
        <main class="content">
            <h2 class="titre-page">nos fournisseurs</h2>
            <div id="suppliers-list" class="fournisseur-list">
                <!-- Les fournisseurs Supabase s'afficheront ici -->
                <p style="text-align:center;">Chargement des fournisseurs...</p>
            </div>
        </main>
    </div>

    <!-- PAGE INSCRIPTION FOURNISSEUR -->
    <div id="page-inscription-fournisseur" class="page">
        <main class="content">
            <h2 class="titre-page">devenir fournisseur</h2>
            <form id="form-add-supplier" class="supplier-form">
                <div class="photo-upload">
                    <label for="f-photo">
                        <div id="photo-preview"><i class="fa-solid fa-camera"></i><br>Photo</div>
                    </label>
                    <input type="file" id="f-photo" accept="image/*" hidden required>
                </div>
                
                <input type="text" id="f-nom" placeholder="Nom" required>
                <input type="text" id="f-postnom" placeholder="Post-nom" required>
                <input type="text" id="f-prenom" placeholder="Prénom" required>
                <input type="text" id="f-phone" placeholder="Numéro de téléphone" required>
                <input type="email" id="f-email" placeholder="Email" required>
                <input type="text" id="f-pays" placeholder="Pays (ex: RDC)" required>
                
                <button type="submit" class="btn-submit">S'inscrire comme fournisseur</button>
            </form>
        </main>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-item active" onclick="showFooterPage('fournisseurs', this)">
            <i class="fa-solid fa-users"></i><span>Fournisseurs</span>
        </div>
        <div class="footer-item" onclick="showFooterPage('inscription-fournisseur', this)">
            <i class="fa-solid fa-user-plus"></i><span>S'inscrire</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
