<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM BUSINESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="main-header">
    <div class="logo"><span>P</span><span>M</span> <span>BUSINESS</span></div>
    <div class="search" id="search-bar"><input type="text" placeholder="Rechercher un produit"></div>
    <div class="nav">
        <button class="active" onclick="showPage('articles')">Articles</button>
        <button onclick="showPage('fournisseurs')">Fournisseurs</button>
        <button onclick="showPage('categories')">Catégories</button>
    </div>
</header>

<div id="articles" class="page active"><div class="container"><h2 class="titre">Articles</h2><div class="grid-3" id="articles-grid"></div></div></div>
<div id="fournisseurs" class="page"><div class="container"><h2 class="titre">Fournisseurs</h2><button class="btn-inscrire" onclick="openForm()">S'inscrire comme fournisseur</button><div id="liste-fournisseurs"></div></div></div>
<div id="categories" class="page"><div class="categories"><div class="sidebar" id="sidebar-cat"></div><div class="products"><div class="grid-2" id="cat-products"></div></div></div></div>
<div id="message" class="page"><div class="container"><h2 class="titre">Message</h2><p style="text-align:center;">Comment souhaitez-vous discuter avec un fournisseur?</p><div class="choix-btn"><a href="https://wa.me/243812345678" target="_blank" class="btn-wa">📱 Par WhatsApp</a><a href="#" onclick="openChatList()" class="btn-site">💬 Sur le site</a></div></div></div>
<div id="apropos" class="page"><div class="container"><h2 class="titre">À propos</h2><div style="background:white;padding:20px;border-radius:15px;"><h3>Qui sommes-nous?</h3><p>PM BUSINESS est votre boutique de mode n°1 à Lubumbashi.</p></div></div></div>

<!-- POPUP GENERAL -->
<div class="popup" id="popup"><div class="popup-content"><span class="close" onclick="closePopup()">X</span><div id="popup-content"></div></div></div>

<!-- POPUP FORMULAIRE INSCRIPTION -->
<div class="popup" id="form-popup"><div class="popup-content form-popup"><span class="close" onclick="closeForm()">X</span>
    <h3>Inscription Fournisseur</h3>
    <input type="text" id="nom" placeholder="Nom Complet">
    <input type="tel" id="tel" placeholder="Numéro Téléphone">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="pays" placeholder="Pays">
    <button onclick="inscription()">Valider</button>
</div></div>

<footer id="main-footer">
    <div class="active" onclick="showPage('articles', this)">Accueil</div>
    <div onclick="showPage('message', this)">Message</div>
    <div onclick="showPage('apropos', this)">À propos</div>
</footer>

<script src="script.js"></script>
</body>
</html>
